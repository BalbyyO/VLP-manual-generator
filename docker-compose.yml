services:
  vlp-manual-generator:
    build:
      context: .
      dockerfile: Dockerfile
    image: vlp-manual-generator:latest
    container_name: vlp-manual-generator
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATA_DIR=/data
    volumes:
      - ./data:/data
    restart: unless-stopped
